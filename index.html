<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="main-container">
        <div class="form-container">
            <h3>Password Generator</h3>
            <div class="little-container">
             <div id="empty"></div>
                <button type="btn" id="button" class="btn">COPY</button>
            </div>
            <div class="length">
                <h4> Password Length</h4>
                <input type="text"  id="lengthy" value="">
            </div>
            <div class="upper">
                <h4> Add UpperCase Letters</h4>
                <input type="checkbox"  id="up">
            </div>
            <div class="lower">
                <h4> Add LowerCase Letters</h4>
                <input type="checkbox"  id="down">
            </div>
            <div class="number">
                <h4> Include  The  Numbers</h4>
                <input type="checkbox"  id="num">
            </div>
            <div class="symbol">
                <h4> Add the SpecialChracter</h4>
                <input type="checkbox"  id="sym">
            </div>
            <div class="gen">
                <button type="button" class="btm" id="connect" >Generate Password</button>
            </div>
        </div>
    </div>
    <script src="script.js">
      


    </script>
</body>
</html>
